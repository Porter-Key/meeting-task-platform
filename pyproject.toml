[project]
name = "taskmanagement"
version = "0.1.0"
description = "Task management service"
requires-python = ">=3.11"
dependencies = [
  "structlog>=25.0",
  "qdrant-client>=1.15",
  "PyYAML>=6.0",
  "psycopg[binary]>=3.2",
  "langchain>=1.2.17",
  "langchain-openai>=1.2.1",
  "langchain-qdrant>=1.1.0",
  "pydantic>=2.13.4",
  "tenacity>=9.1.4",
  "scikit-learn>=1.8.0",
  "numpy>=2.4.4",
  "celery>=5.6.0",
  "redis>=7.0.0",
  "django>=5.2.14",
  "django-celery-results>=2.6.0",
  "django-celery-beat>=2.9.0",
  "strawberry-graphql>=0.316.0",
  "strawberry-graphql-django>=0.86.0",
  "djangorestframework>=3.17.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: tests that touch local runtime services",
]
